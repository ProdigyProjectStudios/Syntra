name: Syntra conversion validation

on:
  push:
    branches:
      - feature/assessment-conversion
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Consultation regression tests
        run: pnpm test
      - name: TypeScript
        run: pnpm run typecheck
      - name: AgentPlace transfer validation
        run: pnpm test:agentplace
      - name: Production build
        env:
          PORT: '5173'
          BASE_PATH: '/'
        run: pnpm run build
