name: Syntra handoff checks
on:
  push:
    branches:
      - feature/syntra-client-handoff
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Domain and export tests
        run: pnpm --filter @workspace/consultation test
      - name: TypeScript checks
        run: pnpm run typecheck
      - name: Full workspace build
        run: pnpm run build
        env:
          PORT: '5173'
          BASE_PATH: /
      - name: AgentPlace transfer validation
        run: pnpm test:agentplace
