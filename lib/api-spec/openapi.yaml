openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: advisor
    description: AI build advisor operations
  - name: intelligence
    description: Stateless cross-market decision intelligence
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /opportunity/analyze:
    post:
      operationId: analyzeOpportunity
      tags: [intelligence]
      summary: Compare three approaches to a described opportunity
      description: Returns a structured decision canvas. Inputs and outputs are not stored by this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpportunityInput"
      responses:
        "200":
          description: Decision canvas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityAnalysis"
        "400":
          description: Invalid input
        "429":
          description: Rate limit reached
        "502":
          description: Analysis unavailable
        "503":
          description: Pilot capacity reached

  /evidence/analyze:
    post:
      operationId: analyzeEvidence
      tags: [intelligence]
      summary: Review a proposed decision against visitor-supplied excerpts
      description: Returns claim assessments with server-verified quotations from supplied sources. Inputs and outputs are not stored by this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceInput"
      responses:
        "200":
          description: Evidence review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceAnalysis"
        "400":
          description: Invalid input
        "429":
          description: Rate limit reached
        "502":
          description: Review unavailable
        "503":
          description: Pilot capacity reached

  /action/plan:
    post:
      operationId: planAction
      tags: [intelligence]
      summary: Draft a bounded, measurable pilot plan
      description: Returns a draft experiment plan. The endpoint does not execute actions or store inputs or outputs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionInput"
      responses:
        "200":
          description: Pilot plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionPlan"
        "400":
          description: Invalid input
        "429":
          description: Rate limit reached
        "502":
          description: Planning unavailable
        "503":
          description: Pilot capacity reached

  /services:
    get:
      operationId: listServices
      tags: [advisor]
      summary: List service areas
      description: Returns Digital Prodigy's four service areas for the Solutions experience
      responses:
        "200":
          description: Service areas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceArea"

  /contact-options:
    get:
      operationId: listContactOptions
      tags: [advisor]
      summary: List contact options
      description: Returns Digital Prodigy's verified human contact options for the Book experience
      responses:
        "200":
          description: Contact options
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContactOption"

  /conversations:
    get:
      operationId: listConversations
      tags: [advisor]
      summary: List conversations
      description: Returns advisor conversations belonging to the current visitor session, most recent first
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConversationSummary"
    post:
      operationId: createConversation
      tags: [advisor]
      summary: Start a conversation
      description: Creates a new advisor conversation and returns it with the advisor's opening message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"

  /conversations/{id}:
    get:
      operationId: getConversation
      tags: [advisor]
      summary: Get a conversation
      description: Returns a conversation with its full message history and working brief
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "404":
          description: Not found

  /conversations/{id}/messages:
    post:
      operationId: sendMessage
      tags: [advisor]
      summary: Send a message
      description: Sends a visitor message at the chosen response depth and returns the advisor's reply plus the updated working brief
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "200":
          description: Advisor reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdvisorReply"
        "404":
          description: Not found

  /conversations/{id}/brief:
    get:
      operationId: getBrief
      tags: [advisor]
      summary: Get the working brief
      description: Returns the live project brief assembled from the conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Working brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brief"
        "404":
          description: Not found
    patch:
      operationId: updateBrief
      tags: [advisor]
      summary: Update the working brief
      description: Manually edits fields of the working brief
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BriefUpdate"
      responses:
        "200":
          description: Updated brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brief"
        "404":
          description: Not found

  /conversations/{id}/blueprint:
    get:
      operationId: getBlueprint
      tags: [advisor]
      summary: Read the session's solution blueprint
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Versioned solution blueprint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blueprint"
        "404":
          description: Conversation not found
    patch:
      operationId: updateBlueprint
      tags: [advisor]
      summary: Save a version-checked visitor correction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlueprintUpdate"
      responses:
        "200":
          description: Saved blueprint with edit provenance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blueprint"
        "404":
          description: Conversation not found
        "409":
          description: Blueprint changed or request identity conflicts

  /conversations/{id}/blueprint/regenerate:
    post:
      operationId: regenerateBlueprint
      tags: [advisor]
      summary: Update blueprint from the canonical brief
      description: Synchronizes brief-derived content and preserves visitor edits and specialist contributions. It does not invoke another model or provision integrations.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlueprintRegenerate"
      responses:
        "200":
          description: Updated solution blueprint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blueprint"
        "404":
          description: Conversation not found
        "409":
          description: Blueprint changed or request identity conflicts

  /voice/sessions:
    post:
      operationId: createVoiceSession
      tags: [advisor]
      summary: Legacy native voice provisioning status
      deprecated: true
      description: Legacy compatibility endpoint; it does not create a working audio connection. Native AgentPlace owns provisioning. The optional Replit speech adapter uses /voice/token after consultation ownership checks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceSessionInput"
      responses:
        "200":
          description: Native voice provisioning is unavailable from this development endpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceSession"

components:
  schemas:
    OpportunityInput:
      type: object
      properties:
        market:
          type: string
          minLength: 2
          maxLength: 80
        challenge:
          type: string
          minLength: 40
          maxLength: 3000
        constraints:
          type: string
          maxLength: 1000
      required: [market, challenge]

    OpportunityRoute:
      type: object
      properties:
        name:
          type: string
        approach:
          type: string
        firstRelease:
          type: string
        effort:
          type: string
          enum: [LOW, MEDIUM, HIGH]
        mainRisk:
          type: string
        tradeoff:
          type: string
      required: [name, approach, firstRelease, effort, mainRisk, tradeoff]

    AdjacentMarket:
      type: object
      properties:
        market:
          type: string
        transfer:
          type: string
      required: [market, transfer]

    OpportunityAnalysis:
      type: object
      properties:
        headline:
          type: string
        diagnosis:
          type: string
        valueAtStake:
          type: string
        routes:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/OpportunityRoute"
        recommendedRoute:
          type: integer
          minimum: 0
          maximum: 2
        recommendationReason:
          type: string
        firstExperiment:
          type: string
        successSignal:
          type: string
        assumptions:
          type: array
          items:
            type: string
        questions:
          type: array
          items:
            type: string
        adjacentMarkets:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/AdjacentMarket"
        confidence:
          type: string
          enum: [LOW, MEDIUM, HIGH]
        confidenceReason:
          type: string
      required: [headline, diagnosis, valueAtStake, routes, recommendedRoute, recommendationReason, firstExperiment, successSignal, assumptions, questions, adjacentMarkets, confidence, confidenceReason]

    EvidenceInput:
      type: object
      properties:
        decision:
          type: string
          minLength: 20
          maxLength: 2000
        sources:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: "#/components/schemas/EvidenceSource"
      required: [decision, sources]

    EvidenceSource:
      type: object
      properties:
        id:
          type: string
          pattern: "^[a-zA-Z0-9_-]{1,50}$"
        title:
          type: string
          minLength: 2
          maxLength: 100
        text:
          type: string
          minLength: 80
          maxLength: 6000
      required: [id, title, text]

    EvidenceCitation:
      type: object
      properties:
        sourceId:
          type: string
        quote:
          type: string
          minLength: 12
          maxLength: 300
      required: [sourceId, quote]

    EvidenceClaim:
      type: object
      properties:
        statement:
          type: string
          minLength: 15
          maxLength: 450
        assessment:
          type: string
          enum: [SUPPORTED, CONFLICTED, UNCLEAR]
        explanation:
          type: string
          minLength: 20
          maxLength: 500
        citations:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/EvidenceCitation"
      required: [statement, assessment, explanation, citations]

    EvidenceAnalysis:
      type: object
      properties:
        headline:
          type: string
          minLength: 8
          maxLength: 150
        stance:
          type: string
          enum: [TEST, REVISE, PAUSE]
        revisedDecision:
          type: string
          minLength: 30
          maxLength: 700
        rationale:
          type: string
          minLength: 25
          maxLength: 700
        claims:
          type: array
          minItems: 3
          maxItems: 6
          items:
            $ref: "#/components/schemas/EvidenceClaim"
        gaps:
          type: array
          minItems: 2
          maxItems: 4
          items:
            type: string
            minLength: 15
            maxLength: 350
        nextValidationStep:
          type: string
          minLength: 25
          maxLength: 500
      required: [headline, stance, revisedDecision, rationale, claims, gaps, nextValidationStep]

    ActionInput:
      type: object
      properties:
        market:
          type: string
          minLength: 2
          maxLength: 80
        experiment:
          type: string
          minLength: 40
          maxLength: 2000
        successSignal:
          type: string
          minLength: 10
          maxLength: 400
        constraints:
          type: string
          maxLength: 1000
      required: [market, experiment, successSignal]

    ActionMeasurement:
      type: object
      properties:
        metric:
          type: string
          minLength: 5
          maxLength: 200
        baselineNeeded:
          type: string
          minLength: 10
          maxLength: 300
        observationMethod:
          type: string
          minLength: 10
          maxLength: 300
        reviewPoint:
          type: string
          minLength: 10
          maxLength: 200
      required: [metric, baselineNeeded, observationMethod, reviewPoint]

    ActionMilestone:
      type: object
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
        deliverable:
          type: string
          minLength: 10
          maxLength: 350
        ownerRole:
          type: string
          minLength: 2
          maxLength: 80
        acceptanceCriteria:
          type: string
          minLength: 10
          maxLength: 350
        approvalGate:
          type: ["string", "null"]
      required: [name, deliverable, ownerRole, acceptanceCriteria, approvalGate]

    ActionEvaluationCase:
      type: object
      properties:
        scenario:
          type: string
          minLength: 10
          maxLength: 300
        expectedBehavior:
          type: string
          minLength: 10
          maxLength: 300
        failureSignal:
          type: string
          minLength: 10
          maxLength: 300
      required: [scenario, expectedBehavior, failureSignal]

    ActionPlan:
      type: object
      properties:
        title:
          type: string
          minLength: 8
          maxLength: 140
        hypothesis:
          type: string
          minLength: 20
          maxLength: 400
        decisionRule:
          type: string
          minLength: 20
          maxLength: 400
        measurement:
          $ref: "#/components/schemas/ActionMeasurement"
        milestones:
          type: array
          minItems: 3
          maxItems: 5
          items:
            $ref: "#/components/schemas/ActionMilestone"
        evaluationCases:
          type: array
          minItems: 3
          maxItems: 5
          items:
            $ref: "#/components/schemas/ActionEvaluationCase"
        assumptions:
          type: array
          minItems: 2
          maxItems: 4
          items:
            type: string
            minLength: 5
            maxLength: 250
        stopConditions:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: string
            minLength: 10
            maxLength: 250
      required: [title, hypothesis, decisionRule, measurement, milestones, evaluationCases, assumptions, stopConditions]

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ServiceArea:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        tagline:
          type: string
        description:
          type: string
        capabilities:
          type: array
          items:
            type: string
      required:
        - id
        - name
        - tagline
        - description
        - capabilities

    ContactOption:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        detail:
          type: string
        href:
          type: string
        kind:
          type: string
          enum: [link, email, phone]
      required:
        - id
        - label
        - detail
        - href
        - kind

    ConversationSummary:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        depth:
          $ref: "#/components/schemas/ResponseDepth"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        messageCount:
          type: integer
      required:
        - id
        - title
        - depth
        - createdAt
        - updatedAt
        - messageCount

    Conversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        depth:
          $ref: "#/components/schemas/ResponseDepth"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        brief:
          $ref: "#/components/schemas/Brief"
        blueprint:
          $ref: "#/components/schemas/Blueprint"
      required:
        - id
        - title
        - depth
        - createdAt
        - updatedAt
        - messages
        - brief

    ConversationInput:
      type: object
      properties:
        depth:
          $ref: "#/components/schemas/ResponseDepth"
      required:
        - depth

    Message:
      type: object
      properties:
        id:
          type: integer
        role:
          type: string
          enum: [visitor, advisor]
        content:
          type: string
        depth:
          $ref: "#/components/schemas/ResponseDepth"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - role
        - content
        - depth
        - createdAt

    MessageInput:
      type: object
      properties:
        specialist:
          $ref: "#/components/schemas/SpecialistId"
        requestId:
          type: string
          format: uuid
        content:
          type: string
          minLength: 1
          maxLength: 12000
        depth:
          $ref: "#/components/schemas/ResponseDepth"
      required:
        - requestId
        - content
        - depth

    AdvisorReply:
      type: object
      properties:
        specialist:
          $ref: "#/components/schemas/SpecialistId"
        visitorMessage:
          $ref: "#/components/schemas/Message"
        message:
          $ref: "#/components/schemas/Message"
        brief:
          $ref: "#/components/schemas/Brief"
        blueprint:
          $ref: "#/components/schemas/Blueprint"
        suggestedNextSteps:
          type: array
          items:
            type: string
      required:
        - visitorMessage
        - message
        - brief
        - suggestedNextSteps

    ResponseDepth:
      type: string
      enum: [concise, detailed, deep_dive]

    SpecialistId:
      type: string
      description: Consultation perspective within the same model, conversation and project brief. Omitted historical values mean syntra.
      enum: [syntra, technical, automation]

    Brief:
      type: object
      properties:
        revision:
          type: integer
          minimum: 0
        provenance:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/FieldProvenance"
        objective:
          type: ["string", "null"]
        service:
          type: ["string", "null"]
        proposedSolution:
          type: ["string", "null"]
        requirements:
          type: ["string", "null"]
        integrations:
          type: ["string", "null"]
        budget:
          type: ["string", "null"]
        timeline:
          type: ["string", "null"]
        nextStep:
          type: ["string", "null"]
      required:
        - revision
        - provenance
        - objective
        - service
        - proposedSolution
        - requirements
        - integrations
        - budget
        - timeline
        - nextStep

    BriefUpdate:
      type: object
      properties:
        revision:
          type: integer
          minimum: 0
        objective:
          type: ["string", "null"]
        service:
          type: ["string", "null"]
        proposedSolution:
          type: ["string", "null"]
        requirements:
          type: ["string", "null"]
        integrations:
          type: ["string", "null"]
        budget:
          type: ["string", "null"]
        timeline:
          type: ["string", "null"]
        nextStep:
          type: ["string", "null"]
      required:
        - revision

    FieldProvenance:
      type: object
      properties:
        status:
          type: string
          enum: [confirmed, suggested, manual]
        evidence:
          type: string
      required: [status, evidence]

    VoiceSessionInput:
      type: object
      properties:
        conversationId:
          type: integer
      required:
        - conversationId

    VoiceSession:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [unavailable]
        conversationId:
          type: integer
        transport:
          type: string
        detail:
          type: string
      required:
        - id
        - status
        - conversationId
        - transport
        - detail

    BlueprintSectionKey:
      type: string
      enum:
      - objectives
      - services
      - architecture
      - integrations
      - workflows
      - roadmap
      - risks
      - tradeoffs
      - value
      - decisions
    BlueprintStatus:
      type: string
      enum:
      - confirmed
      - recommendation
      - assumption
      - manual
    BlueprintDetail:
      type: object
      properties:
        label:
          type: string
          maxLength: 60
        value:
          type: string
          maxLength: 300
      required:
      - label
      - value
    BlueprintQuantity:
      type: object
      properties:
        value:
          type: number
          minimum: 0
        status:
          type: string
          enum:
          - confirmed
          - assumption
        evidence:
          type: string
          maxLength: 2000
      required:
      - value
      - status
      - evidence
    BlueprintCalculation:
      type: object
      properties:
        monthlyVolume:
          $ref: '#/components/schemas/BlueprintQuantity'
        minutesBefore:
          $ref: '#/components/schemas/BlueprintQuantity'
        minutesAfter:
          $ref: '#/components/schemas/BlueprintQuantity'
        hourlyCost:
          $ref: '#/components/schemas/BlueprintQuantity'
        currency:
          type: string
          maxLength: 12
      required:
      - monthlyVolume
      - minutesBefore
      - minutesAfter
    BlueprintItem:
      type: object
      properties:
        id:
          type: string
          maxLength: 80
        title:
          type: string
          maxLength: 160
        detail:
          type: string
          maxLength: 1200
        status:
          $ref: '#/components/schemas/BlueprintStatus'
        evidence:
          type: string
          maxLength: 2000
        specialist:
          $ref: '#/components/schemas/SpecialistId'
        source:
          type: string
          enum:
          - brief
          - specialist
          - manual
        reviewRequired:
          type: boolean
        details:
          type: array
          items:
            $ref: '#/components/schemas/BlueprintDetail'
          maxItems: 6
        calculation:
          $ref: '#/components/schemas/BlueprintCalculation'
      required:
      - id
      - title
      - detail
      - status
      - evidence
      - specialist
      - source
    BlueprintHistoryItem:
      type: object
      properties:
        title:
          type: string
          maxLength: 160
        detail:
          type: string
          maxLength: 240
        status:
          $ref: '#/components/schemas/BlueprintStatus'
      required:
      - title
      - detail
      - status
    BlueprintChangeRecord:
      type: object
      properties:
        section:
          $ref: '#/components/schemas/BlueprintSectionKey'
        itemId:
          type: string
          maxLength: 80
        before:
          anyOf:
          - $ref: '#/components/schemas/BlueprintHistoryItem'
          - type: 'null'
        after:
          anyOf:
          - $ref: '#/components/schemas/BlueprintHistoryItem'
          - type: 'null'
      required:
      - section
      - itemId
      - before
      - after
    BlueprintVersion:
      type: object
      properties:
        version:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        source:
          type: string
          enum:
          - brief
          - specialist
          - manual
          - regenerate
        specialist:
          $ref: '#/components/schemas/SpecialistId'
        changedSections:
          type: array
          items:
            $ref: '#/components/schemas/BlueprintSectionKey'
          maxItems: 10
        changes:
          type: array
          items:
            $ref: '#/components/schemas/BlueprintChangeRecord'
          maxItems: 24
      required:
      - version
      - createdAt
      - source
      - specialist
      - changedSections
      - changes
    Blueprint:
      type: object
      properties:
