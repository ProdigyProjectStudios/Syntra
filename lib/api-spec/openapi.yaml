openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: advisor
    description: AI build advisor operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /services:
    get:
      operationId: listServices
      tags: [advisor]
      summary: List service areas
      description: Returns Digital Prodigy's four service areas for the Solutions experience
      responses:
        "200":
          description: Service areas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceArea"

  /contact-options:
    get:
      operationId: listContactOptions
      tags: [advisor]
      summary: List contact options
      description: Returns Digital Prodigy's verified human contact options for the Book experience
      responses:
        "200":
          description: Contact options
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContactOption"

  /conversations:
    get:
      operationId: listConversations
      tags: [advisor]
      summary: List conversations
      description: Returns all advisor conversations, most recent first, for persistent chat history
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConversationSummary"
    post:
      operationId: createConversation
      tags: [advisor]
      summary: Start a conversation
      description: Creates a new advisor conversation and returns it with the advisor's opening message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"

  /conversations/{id}:
    get:
      operationId: getConversation
      tags: [advisor]
      summary: Get a conversation
      description: Returns a conversation with its full message history and working brief
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "404":
          description: Not found

  /conversations/{id}/messages:
    post:
      operationId: sendMessage
      tags: [advisor]
      summary: Send a message
      description: Sends a visitor message at the chosen response depth and returns the advisor's reply plus the updated working brief
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "200":
          description: Advisor reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdvisorReply"
        "404":
          description: Not found

  /conversations/{id}/brief:
    get:
      operationId: getBrief
      tags: [advisor]
      summary: Get the working brief
      description: Returns the live project brief assembled from the conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Working brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brief"
        "404":
          description: Not found
    patch:
      operationId: updateBrief
      tags: [advisor]
      summary: Update the working brief
      description: Manually edits fields of the working brief
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BriefUpdate"
      responses:
        "200":
          description: Updated brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brief"
        "404":
          description: Not found

  /conversations/{id}/blueprint:
    get:
      operationId: getBlueprint
      tags: [advisor]
      summary: Read the session's solution blueprint
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Versioned solution blueprint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blueprint"
        "404":
          description: Conversation not found
    patch:
      operationId: updateBlueprint
      tags: [advisor]
      summary: Save a version-checked visitor correction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlueprintUpdate"
      responses:
        "200":
          description: Saved blueprint with edit provenance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blueprint"
        "404":
          description: Conversation not found
        "409":
          description: Blueprint changed or request identity conflicts

  /conversations/{id}/blueprint/regenerate:
    post:
      operationId: regenerateBlueprint
      tags: [advisor]
      summary: Update blueprint from the canonical brief
      description: Synchronizes brief-derived content and preserves visitor edits and specialist contributions. It does not invoke another model or provision integrations.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlueprintRegenerate"
      responses:
        "200":
          description: Updated solution blueprint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blueprint"
        "404":
          description: Conversation not found
        "409":
          description: Blueprint changed or request identity conflicts

  /voice/sessions:
    post:
      operationId: createVoiceSession
      tags: [advisor]
      summary: Legacy native voice provisioning status
      deprecated: true
      description: Legacy compatibility endpoint; it does not create a working audio connection. Native AgentPlace owns provisioning. The optional Replit speech adapter uses /voice/token after consultation ownership checks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceSessionInput"
      responses:
        "200":
          description: Native voice provisioning is unavailable from this development endpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceSession"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ServiceArea:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        tagline:
          type: string
        description:
          type: string
        capabilities:
          type: array
          items:
            type: string
      required:
        - id
        - name
        - tagline
        - description
        - capabilities

    ContactOption:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        detail:
          type: string
        href:
          type: string
        kind:
          type: string
          enum: [link, email, phone]
      required:
        - id
        - label
        - detail
        - href
        - kind

    ConversationSummary:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        depth:
          $ref: "#/components/schemas/ResponseDepth"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        messageCount:
          type: integer
      required:
        - id
        - title
        - depth
        - createdAt
        - updatedAt
        - messageCount

    Conversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        depth:
          $ref: "#/components/schemas/ResponseDepth"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        brief:
          $ref: "#/components/schemas/Brief"
        blueprint:
          $ref: "#/components/schemas/Blueprint"
      required:
        - id
        - title
        - depth
        - createdAt
        - updatedAt
        - messages
        - brief

    ConversationInput:
      type: object
      properties:
        depth:
          $ref: "#/components/schemas/ResponseDepth"
      required:
        - depth

    Message:
      type: object
      properties:
        id:
          type: integer
        role:
          type: string
          enum: [visitor, advisor]
        content:
          type: string
        depth:
          $ref: "#/components/schemas/ResponseDepth"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - role
        - content
        - depth
        - createdAt

    MessageInput:
      type: object
      properties:
        specialist:
          $ref: "#/components/schemas/SpecialistId"
        requestId:
          type: string
          format: uuid
        content:
          type: string
          minLength: 1
          maxLength: 12000
        depth:
          $ref: "#/components/schemas/ResponseDepth"
      required:
        - requestId
        - content
        - depth

    AdvisorReply:
      type: object
      properties:
        specialist:
          $ref: "#/components/schemas/SpecialistId"
        visitorMessage:
          $ref: "#/components/schemas/Message"
        message:
          $ref: "#/components/schemas/Message"
        brief:
          $ref: "#/components/schemas/Brief"
        blueprint:
          $ref: "#/components/schemas/Blueprint"
        suggestedNextSteps:
          type: array
          items:
            type: string
      required:
        - visitorMessage
        - message
        - brief
        - suggestedNextSteps

    ResponseDepth:
      type: string
      enum: [concise, detailed, deep_dive]

    SpecialistId:
      type: string
      description: Consultation perspective within the same model, conversation and project brief. Omitted historical values mean syntra.
      enum: [syntra, technical, automation]

    Brief:
      type: object
      properties:
        revision:
          type: integer
          minimum: 0
        provenance:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/FieldProvenance"
        objective:
          type: ["string", "null"]
        service:
          type: ["string", "null"]
        proposedSolution:
          type: ["string", "null"]
        requirements:
          type: ["string", "null"]
        integrations:
          type: ["string", "null"]
        budget:
          type: ["string", "null"]
        timeline:
          type: ["string", "null"]
        nextStep:
          type: ["string", "null"]
      required:
        - revision
        - provenance
        - objective
        - service
        - proposedSolution
        - requirements
        - integrations
        - budget
        - timeline
        - nextStep

    BriefUpdate:
      type: object
      properties:
        revision:
          type: integer
          minimum: 0
        objective:
          type: ["string", "null"]
        service:
          type: ["string", "null"]
        proposedSolution:
          type: ["string", "null"]
        requirements:
          type: ["string", "null"]
        integrations:
          type: ["string", "null"]
        budget:
          type: ["string", "null"]
        timeline:
          type: ["string", "null"]
        nextStep:
          type: ["string", "null"]
      required:
        - revision

    FieldProvenance:
      type: object
      properties:
        status:
          type: string
          enum: [confirmed, suggested, manual]
        evidence:
          type: string
      required: [status, evidence]

    VoiceSessionInput:
      type: object
      properties:
        conversationId:
          type: integer
      required:
        - conversationId

    VoiceSession:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [unavailable]
        conversationId:
          type: integer
        transport:
          type: string
        detail:
          type: string
      required:
        - id
        - status
        - conversationId
        - transport
        - detail

    BlueprintSectionKey:
      type: string
      enum:
      - objectives
      - services
      - architecture
      - integrations
      - workflows
      - roadmap
      - risks
      - tradeoffs
      - value
      - decisions
    BlueprintStatus:
      type: string
      enum:
      - confirmed
      - recommendation
      - assumption
      - manual
    BlueprintDetail:
      type: object
      properties:
        label:
          type: string
          maxLength: 60
        value:
          type: string
          maxLength: 300
      required:
      - label
      - value
    BlueprintQuantity:
      type: object
      properties:
        value:
          type: number
          minimum: 0
        status:
          type: string
          enum:
          - confirmed
          - assumption
        evidence:
          type: string
          maxLength: 2000
      required:
      - value
      - status
      - evidence
    BlueprintCalculation:
      type: object
      properties:
        monthlyVolume:
          $ref: '#/components/schemas/BlueprintQuantity'
        minutesBefore:
          $ref: '#/components/schemas/BlueprintQuantity'
        minutesAfter:
          $ref: '#/components/schemas/BlueprintQuantity'
        hourlyCost:
          $ref: '#/components/schemas/BlueprintQuantity'
        currency:
          type: string
          maxLength: 12
      required:
      - monthlyVolume
      - minutesBefore
      - minutesAfter
    BlueprintItem:
      type: object
      properties:
        id:
          type: string
          maxLength: 80
        title:
          type: string
          maxLength: 160
        detail:
          type: string
          maxLength: 1200
        status:
          $ref: '#/components/schemas/BlueprintStatus'
        evidence:
          type: string
          maxLength: 2000
        specialist:
          $ref: '#/components/schemas/SpecialistId'
        source:
          type: string
          enum:
          - brief
          - specialist
          - manual
        reviewRequired:
          type: boolean
        details:
          type: array
          items:
            $ref: '#/components/schemas/BlueprintDetail'
          maxItems: 6
        calculation:
          $ref: '#/components/schemas/BlueprintCalculation'
      required:
      - id
      - title
      - detail
      - status
      - evidence
      - specialist
      - source
    BlueprintHistoryItem:
      type: object
      properties:
        title:
          type: string
          maxLength: 160
        detail:
          type: string
          maxLength: 240
        status:
          $ref: '#/components/schemas/BlueprintStatus'
      required:
      - title
      - detail
      - status
    BlueprintChangeRecord:
      type: object
      properties:
        section:
          $ref: '#/components/schemas/BlueprintSectionKey'
        itemId:
          type: string
          maxLength: 80
        before:
          anyOf:
          - $ref: '#/components/schemas/BlueprintHistoryItem'
          - type: 'null'
        after:
          anyOf:
          - $ref: '#/components/schemas/BlueprintHistoryItem'
          - type: 'null'
      required:
      - section
      - itemId
      - before
      - after
    BlueprintVersion:
      type: object
      properties:
        version:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        source:
          type: string
          enum:
          - brief
          - specialist
          - manual
          - regenerate
        specialist:
          $ref: '#/components/schemas/SpecialistId'
        changedSections:
          type: array
          items:
            $ref: '#/components/schemas/BlueprintSectionKey'
          maxItems: 10
        changes:
          type: array
          items:
            $ref: '#/components/schemas/BlueprintChangeRecord'
          maxItems: 24
      required:
      - version
      - createdAt
      - source
      - specialist
      - changedSections
      - changes
    Blueprint:
      type: object
      properties:
        version:
          type: integer
          minimum: 0
        briefRevision:
          type: integer
          minimum: 0
        updatedAt:
          type: string
          description: ISO timestamp after the first saved version; empty for an untouched version-zero blueprint.
        sections:
          type: object
          properties:
            objectives:
              type: array
              items:
                $ref: '#/components/schemas/BlueprintItem'
              maxItems: 8
            services:
              type: array
              items:
                $ref: '#/components/schemas/BlueprintItem'
              maxItems: 8
            architecture:
              type: array
              items:
                $ref: '#/components/schemas/BlueprintItem'
              maxItems: 8
            integrations:
              type: array
              items:
                $ref: '#/components/schemas/BlueprintItem'
              maxItems: 8
            workflows:
              type: array
              items:
                $ref: '#/components/schemas/BlueprintItem'
              maxItems: 8
            roadmap:
              type: array
              items:
                $ref: '#/components/schemas/BlueprintItem'
              maxItems: 8
            risks:
              type: array
              items:
                $ref: '#/components/schemas/BlueprintItem'
              maxItems: 8
            tradeoffs:
              type: array
              items:
                $ref: '#/components/schemas/BlueprintItem'
              maxItems: 8
            value:
              type: array
              items:
                $ref: '#/components/schemas/BlueprintItem'
              maxItems: 8
            decisions:
              type: array
              items:
                $ref: '#/components/schemas/BlueprintItem'
              maxItems: 8
          required:
          - objectives
          - services
          - architecture
          - integrations
          - workflows
          - roadmap
          - risks
          - tradeoffs
          - value
          - decisions
        history:
          type: array
          items:
            $ref: '#/components/schemas/BlueprintVersion'
          maxItems: 5
        removedItemIds:
          type: array
          items:
            type: string
            maxLength: 100
      required:
      - version
      - briefRevision
      - updatedAt
      - sections
      - history
      - removedItemIds
    BlueprintEdit:
      type: object
      properties:
        section:
          $ref: '#/components/schemas/BlueprintSectionKey'
        itemId:
          type: string
          maxLength: 80
        title:
          type: string
          maxLength: 160
        detail:
          type: string
          maxLength: 1200
        details:
          type: array
          items:
            $ref: '#/components/schemas/BlueprintDetail'
          maxItems: 6
        remove:
          type: boolean
      required:
      - section
      - itemId
    BlueprintRegenerate:
      type: object
      properties:
        version:
          type: integer
          minimum: 0
        requestId:
          type: string
          format: uuid
      required:
      - version
      - requestId
    BlueprintUpdate:
      type: object
      properties:
        version:
          type: integer
          minimum: 0
        requestId:
          type: string
          format: uuid
        edit:
          $ref: '#/components/schemas/BlueprintEdit'
      required:
      - version
      - requestId
      - edit
